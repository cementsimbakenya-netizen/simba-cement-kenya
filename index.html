<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style id="header-final-logo">
    .logo{min-width:260px!important;width:260px!important;height:82px!important;background:#fff!important;border:0!important;box-shadow:none!important;overflow:hidden!important;display:flex!important;align-items:center!important}
    .logo-img{width:260px!important;height:82px!important;object-fit:contain!important;object-position:left center!important;background:#fff!important;border:0!important;box-shadow:none!important;display:block!important}
    .header-buy,.nav-buy,.where-buy,.where-to-buy{display:none!important}
    @media(max-width:900px){
      .logo{min-width:calc(100% - 56px)!important;width:calc(100% - 56px)!important;height:68px!important}
      .logo-img{width:100%!important;height:68px!important;object-fit:contain!important;object-position:left center!important}
      header .btn{display:none!important}
      header .nav{justify-content:space-between!important;gap:10px!important}
      .hamb{display:block!important;margin-left:auto!important;font-size:28px!important;background:none!important;border:0!important}
    }
  </style>
  <style>
    .hero-carousel{min-height:640px;position:relative;display:flex;align-items:center;overflow:hidden;background:#e9edf1}
    .hero-slide{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .7s ease}
    .hero-slide.active{opacity:1}
    .hero-slide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.38) 34%,rgba(255,255,255,.08) 70%,rgba(18,26,34,.04) 100%)}
    .hero-arrow,.hero-dots{display:none!important}
    .solutions-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#171717}
    .solution{height:210px!important;background-image:none!important;background:#171717!important;display:flex!important;align-items:center!important;justify-content:center!important;border-right:1px solid rgba(255,255,255,.16)!important}
    .solution:last-child{border-right:0!important}.solution:after{display:none!important}.solution h3{position:static!important;margin:0!important;color:#fff!important;text-align:center!important;font-size:18px!important}
    @media(max-width:900px){.hero-carousel{min-height:650px}.solutions-grid{grid-template-columns:repeat(2,1fr)}.solution{height:150px!important}}
    @media(max-width:560px){.hero-carousel{min-height:620px}.solutions-grid{grid-template-columns:1fr}.solution{height:110px!important}}
  </style>
<style id="fullscreen-hero-carousel">
/* Match the supplied reference: large hero image, but not a giant browser-height panel. */
.hero-carousel{
  height:650px!important;
  min-height:650px!important;
  max-height:650px!important;
  overflow:hidden!important;
}
.hero-carousel .hero-slide{
  position:absolute!important;
  inset:0!important;
  background-size:cover!important;
  background-position:center center!important;
  background-repeat:no-repeat!important;
}
/* Remove the extra overlay layer that was washing the photographs out. */
.hero-carousel .hero-slide:after{background:linear-gradient(90deg,rgba(255,255,255,.70) 0%,rgba(255,255,255,.42) 30%,rgba(255,255,255,.08) 62%,rgba(18,26,34,.02) 100%)!important}
.hero-carousel .hero-overlay{display:none!important}
.hero-carousel .hero-arrow,.hero-carousel .hero-dots{display:none!important}
.hero-carousel .hero-content{height:100%!important;display:flex!important;align-items:center!important}
.hero-carousel .hero-inner{padding:65px 0!important}
@media(max-width:900px){
  .hero-carousel{height:620px!important;min-height:620px!important;max-height:620px!important}
  .hero-carousel .hero-slide:after{background:linear-gradient(180deg,rgba(255,255,255,.70) 0%,rgba(255,255,255,.34) 55%,rgba(255,255,255,.06) 100%)!important}
}
@media(max-width:600px){
  .hero-carousel{height:600px!important;min-height:600px!important;max-height:600px!important}
}
</style></head>
<body>
<!-- NOTE: This file is intentionally kept as a lightweight header override layer. -->
<script>
(function(){
  const apply=()=>{
    const oldLogo='https://i.postimg.cc/CKSsrtbF/Screenshot-2026-09-01-142431.png';
    const newLogo='https://i.postimg.cc/RhRx14Vm/Screenshot-2026-09-02-151638.png';
    const img=document.querySelector('.logo-img');
    if(img){img.src=newLogo;img.alt='Simba Cement';}
    document.querySelectorAll('header .btn, .header-buy, .nav-buy, .where-buy, .where-to-buy').forEach(e=>e.remove());
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply);else apply();
})();
</script>
</body>
</html>
