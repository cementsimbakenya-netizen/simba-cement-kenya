<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOP / OUR PRODUCTS | Simba Cement Kenya</title>
<meta name="description" content="Shop Simba Cement Kenya cement and building materials. Adjust quantities and send your quotation to WhatsApp.">
<style>
:root{--blue:#245a8d;--dark:#121a22;--muted:#66717c;--line:#dfe5ea}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7f9;color:var(--dark)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.bar{max-width:1180px;margin:auto;min-height:76px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{width:190px;height:56px;object-fit:contain;object-position:left center}.home{background:var(--blue);color:#fff;padding:12px 17px;font-weight:900;text-decoration:none}
main{max-width:1180px;margin:auto;padding:55px 20px}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:3px;font-weight:900}.hero{margin-bottom:30px}.hero h1{font-size:clamp(38px,5vw,64px);line-height:.95;margin:10px 0}.hero p{color:var(--muted);max-width:650px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid var(--line);padding:18px;box-shadow:0 8px 28px #0000000b}.pic{height:240px;background:#eef2f5;display:grid;place-items:center;overflow:hidden}.pic img{max-width:100%;max-height:100%;object-fit:contain}.cat{margin-top:17px;color:var(--blue);font-size:11px;letter-spacing:2px;font-weight:900}.card h2{font-size:20px;margin:8px 0}.desc{font-size:14px;color:var(--muted);min-height:55px}.price{font-size:20px;font-weight:900;margin:14px 0}.add{width:100%;border:0;background:var(--blue);color:#fff;padding:12px;font-weight:900;cursor:pointer}.quote{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border:0;border-radius:50%;background:var(--dark);color:#fff;font-size:21px;cursor:pointer;box-shadow:0 10px 25px #0003}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:100;align-items:flex-end;justify-content:flex-end}.modal.open{display:flex}.panel{height:100%;width:min(470px,100%);background:#fff;padding:22px;display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center}.items{flex:1;overflow:auto;margin:10px 0}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.mini{display:flex;gap:5px;align-items:center}.mini button{width:30px;height:30px;border:1px solid #ccd4dc;background:#fff;font-weight:900}.remove{border:0;background:none;font-size:20px}.total{font-size:22px;font-weight:900;margin:12px 0}.fields input{display:block;width:100%;padding:12px;border:1px solid var(--line);margin:6px 0}.send{border:0;background:#25d366;color:#fff;padding:13px;font-weight:900;cursor:pointer}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}.logo{width:160px}}
</style>
</head>
<body>
<header><div class="bar"><a href="index.html"><img class="logo" src="https://i.postimg.cc/RhRx14Vm/Screenshot-2026-09-02-151638.png" alt="Simba Cement Kenya"></a><a class="home" href="index.html">HOME</a></div></header>
<main><div class="hero"><div class="eyebrow">SHOP / OUR PRODUCTS</div><h1>Choose your building materials.</h1><p>Adjust quantities, add products to your quotation and send the complete request directly to WhatsApp.</p></div><div class="grid" id="productsGrid"></div></main>
<button class="quote" id="openQuote" aria-label="Open quotation">🛒</button>
<div class="modal" id="modal"><div class="panel"><div class="head"><h2>Your quotation</h2><button class="remove" id="closeQuote">×</button></div><div class="items" id="quoteItems"></div><div class="total" id="quoteTotal">KSh 0</div><div class="fields"><input id="custName" placeholder="Name"><input id="custPhone" placeholder="Phone number"><input id="custLocation" placeholder="Location"></div><p style="font-size:13px;color:#66717c">Enter your details, then continue to WhatsApp.</p><button class="send" id="sendQuote">SEND QUOTATION TO WHATSAPP</button></div></div>
<script>
(async function(){
const WA='254780079982';let products=[],cart=JSON.parse(localStorage.getItem('simbaShopCart')||'[]');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
try{const t=await(await fetch('index.html')).text();const d=new DOMParser().parseFromString(t,'text/html');products=[...d.querySelectorAll('#products .card')].map((c,i)=>({id:i,name:c.querySelector('h3')?.textContent.trim()||`Product ${i+1}`,price:Number((c.querySelector('.price')?.textContent||'0').replace(/[^0-9]/g,''))||0,desc:c.querySelector('p')?.textContent.trim()||'',img:c.querySelector('img')?.src||''}));}catch(e){}
const save=()=>{localStorage.setItem('simbaShopCart',JSON.stringify(cart));render()};
function render(){document.getElementById('productsGrid').innerHTML=products.map(p=>`<article class="card"><div class="pic">${p.img?`<img src="${p.img}" alt="${esc(p.name)}">`:''}</div><div class="cat">PRODUCT</div><h2>${esc(p.name)}</h2><div class="desc">${esc(p.desc)}</div><div class="price">KSh ${p.price.toLocaleString()}</div><button class="add" data-add="${p.id}">ADD TO QUOTATION +</button></article>`).join('')||'<p>Products are temporarily unavailable.</p>';document.getElementById('quoteItems').innerHTML=cart.map((x,i)=>`<div class="row"><div><strong>${esc(x.name)}</strong><div style="font-size:12px;color:#66717c">KSh ${x.price.toLocaleString()} each</div></div><div class="mini"><button data-i="${i}" data-d="-1">−</button><span>${x.qty}</span><button data-i="${i}" data-d="1">+</button></div><button class="remove" data-r="${i}">×</button></div>`).join('')||'<p style="color:#66717c">Your quotation is empty.</p>';document.getElementById('quoteTotal').textContent='KSh '+cart.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString()}
const open=()=>document.getElementById('modal').classList.add('open');
document.addEventListener('click',e=>{if(e.target.dataset.add!==undefined){const p=products[+e.target.dataset.add],x=cart.find(a=>a.name===p.name);if(x)x.qty++;else cart.push({...p,qty:1});save();open()}if(e.target.dataset.i!==undefined){const i=+e.target.dataset.i;cart[i].qty+=+e.target.dataset.d;if(cart[i].qty<=0)cart.splice(i,1);save()}if(e.target.dataset.r!==undefined){cart.splice(+e.target.dataset.r,1);save()}if(e.target.id==='openQuote')open();if(e.target.id==='closeQuote')document.getElementById('modal').classList.remove('open');if(e.target.id==='sendQuote'){if(!cart.length){alert('Add at least one product.');return}const n=document.getElementById('custName').value.trim(),ph=document.getElementById('custPhone').value.trim(),l=document.getElementById('custLocation').value.trim();if(!n||!ph||!l){alert('Please enter your name, phone number and location.');return}const lines=cart.map(x=>`- ${x.name} x${x.qty} = KSh ${(x.price*x.qty).toLocaleString()}`).join('\n'),tot=cart.reduce((s,x)=>s+x.price*x.qty,0);window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(`Hello Simba Cement Kenya, I would like a quotation.\n\nName: ${n}\nPhone: ${ph}\nLocation: ${l}\n\nItems:\n${lines}\n\nTotal: KSh ${tot.toLocaleString()}`),'_blank')}});render();
})();
</script>
</body></html>
