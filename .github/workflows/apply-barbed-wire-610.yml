name: Apply supplied Barbed Wire 610mts image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-product:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact image to Barbed Wire 610mts
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          heading = 'Barbed Wire 610mts'
          image = 'https://i.postimg.cc/sDdq0ddt/Screenshot-2026-09-02-135513.png'
          pos = s.find('<h3>' + heading + '</h3>')
          if pos < 0:
              raise SystemExit('Barbed Wire 610mts heading not found')
          start = s.rfind('<article class="reference-product-card', 0, pos)
          end = s.find('</article>', pos)
          if start < 0 or end < 0:
              raise SystemExit('Barbed Wire 610mts card not found')
          end += len('</article>')
          card = s[start:end]
          pat = re.compile(r'<div class="reference-product-image(?: reference-product-placeholder)?">.*?</div>', re.S)
          card, n = pat.subn(f'<div class="reference-product-image"><img src="{image}" alt="{heading}"></div>', card, count=1)
          if n != 1:
              raise SystemExit('Barbed Wire 610mts image container not found')
          s = s[:start] + card + s[end:]
          p.write_text(s, encoding='utf-8')
          if f'src="{image}"' not in card:
              raise SystemExit('Verification failed')
          print('Verified Barbed Wire 610mts image')

      - name: Commit product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Image already applied.'
            exit 0
          fi
          git commit -m 'Apply Barbed Wire 610mts product image'
          git push origin main
