name: Fix homepage section order

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Products directly after About Us
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def section_by_id(text, section_id):
              marker = f'id="{section_id}"'
              marker_pos = text.find(marker)
              start = text.rfind('<section', 0, marker_pos + 1)
              if marker_pos < 0 or start < 0:
                  raise SystemExit(f'Could not find section {section_id}')
              end = text.find('</section>', marker_pos)
              if end < 0:
                  raise SystemExit(f'Could not find closing tag for {section_id}')
              return start, end + len('</section>')

          about_start, about_end = section_by_id(s, 'about')
          product_start, product_end = section_by_id(s, 'products')

          if product_start < about_start:
              products = s[product_start:product_end]
              s = s[:product_start] + s[product_end:]
              about_start, about_end = section_by_id(s, 'about')
              s = s[:about_end] + '\n' + products + s[about_end:]

          # Remove the old five-card feature strip if it is still present.
          m = re.search(r'<section\s+class="feature"[^>]*>.*?</section>', s, flags=re.S|re.I)
          if m:
              s = s[:m.start()] + s[m.end():]

          p.write_text(s, encoding='utf-8')

      - name: Commit homepage order
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage order changes needed.'
          else
            git commit -m 'Place products after about and remove feature strip'
            git push
          fi
