name: Fix homepage section order

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Products directly after About Us
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def section_by_id(text, section_id):
              marker = f'id="{section_id}"'
              start = text.find('<section', text.find(marker) - 200)
              if start < 0:
                  raise SystemExit(f'Could not find section {section_id}')
              end = text.find('</section>', start)
              if end < 0:
                  raise SystemExit(f'Could not find closing tag for {section_id}')
              return start, end + len('</section>')

          about_start, about_end = section_by_id(s, 'about')
          product_start, product_end = section_by_id(s, 'products')

          if product_start < about_start:
              products = s[product_start:product_end]
              s = s[:product_start] + s[product_end:]
              about_start, about_end = section_by_id(s, 'about')
              s = s[:about_end] + '\n' + products + s[about_end:]

          # Ensure the old five-card feature strip is absent from the home page.
          m = re.search(r'<section\s+class="feature"[^>]*>.*?</section>', s, flags=re.S|re.I)
          if m:
              s = s[:m.start()] + s[m.end():]

          p.write_text(s, encoding='utf-8')

      - name: Commit homepage order
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Place products after about and remove feature strip'
          git push
