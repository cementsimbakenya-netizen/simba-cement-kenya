name: Apply first supplied product image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace first product placeholder with supplied image
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          image = 'https://i.postimg.cc/HLjF3JtR/Screenshot-2026-09-01-205350.png'

          pattern = re.compile(
              r'(function renderProducts\(\)\{.*?g\.innerHTML=products\.map\(p=>`<article class="card"><div class="product-img">)'
              r'<div class="bag"></div>'
              r'(</div><div class="product-body">)',
              re.S,
          )
          replacement = r"\1<div class=\"real-product-photo\"><img src=\"" + image + r"\" alt=\"Simba Cement product\"></div>\2"
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate first product card renderer.')

          css = '''\n          .real-product-photo{height:260px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}\n          .real-product-photo img{width:100%;height:100%;display:block;object-fit:contain;object-position:center;background:#fff}\n          '''
          if '.real-product-photo{' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          print('Applied first supplied product image:', image)

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-first-product-image.yml
          git commit -m 'Use supplied image for first cement product'
          git push
