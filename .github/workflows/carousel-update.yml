name: Keep hero carousel configuration stable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify supplied hero images are present
        run: |
          test -f index.html
          grep -q '1zvgDdzS/Screenshot-2026-09-01-205904.png' index.html
          grep -q '9f623F43/Screenshot-2026-09-01-205703.png' index.html
          grep -q '5NCtjTVP/Screenshot-2026-09-01-205620.png' index.html
          grep -q 'CKSsrtbF/Screenshot-2026-09-01-142431.png' index.html
