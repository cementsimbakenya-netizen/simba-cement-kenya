name: Put Products after About

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/order-products-after-about.yml'

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Products section after About section
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def extract_section(html, section_id):
              pat = re.compile(r'<section\b[^>]*\bid=["\']' + re.escape(section_id) + r'["\'][^>]*>.*?</section>', re.I | re.S)
              m = pat.search(html)
              return m

          about = extract_section(s, 'about')
          products = extract_section(s, 'products')
          if not about or not products:
              raise SystemExit('Could not locate both #about and #products sections')

          # Remove the Products block, then re-find About and insert Products immediately after it.
          products_text = products.group(0)
          s_without = s[:products.start()] + s[products.end():]
          about2 = extract_section(s_without, 'about')
          if not about2:
              raise SystemExit('About section disappeared during reorder')

          insertion = about2.end()
          s_final = s_without[:insertion] + '\n\n' + products_text + s_without[insertion:]
          p.write_text(s_final, encoding='utf-8')
          print('Products section moved immediately after About section.')

      - name: Commit reorder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Place Products section after About'
          git push
