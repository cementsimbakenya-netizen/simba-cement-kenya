name: Keep Products before About

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/order-products-after-about.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Products before About
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          def block(text, sid):
              m = re.search(r'<section\b[^>]*\bid=["\']'+re.escape(sid)+r'["\'][^>]*>.*?</section>', text, re.S|re.I)
              if not m: raise SystemExit(f'Missing #{sid}')
              return m
          about = block(s,'about'); products = block(s,'products')
          if products.start() > about.start():
              pt = products.group(0)
              s = s[:products.start()] + s[products.end():]
              about = block(s,'about')
              s = s[:about.start()] + pt + '\n' + s[about.start():]
          p.write_text(s, encoding='utf-8')
      - name: Commit corrected order
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Products already before About.'; else git commit -m 'Keep Products before About Us'; git push; fi
