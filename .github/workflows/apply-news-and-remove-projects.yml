name: Apply latest news and remove Projects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Remove Projects from navigation.
          html = re.sub(r'<a href="#projects">\s*PROJECTS\s*</a>', '', html, count=1, flags=re.I)

          # Remove the entire Projects section.
          html, n = re.subn(
              r'\s*<section class="projects" id="projects">.*?</section>\s*',
              '\n', html, count=1, flags=re.S|re.I
          )
          if n != 1:
              raise SystemExit(f'Projects section removal failed: found {n}')

          # Remove Projects from footer/other visible links.
          html = re.sub(r'<a href="#projects">\s*Projects\s*</a>', '', html, flags=re.I)

          news = '''
    <section id="news"><div class="container"><div class="section-head"><div class="eyebrow">NEWS & UPDATES</div><h2>Latest Simba Cement updates.</h2><div class="redline"></div><p>Recent public updates connected to Simba Cement and National Cement Company Limited.</p></div><div class="news-grid">
      <article class="news-card" style="padding:28px"><small>7 AUGUST 2026 · INDUSTRY & OPERATIONS</small><h3>Government orders closure of Simba Cement quarries in Rabai</h3><p>Kenya's Cabinet Secretary for Mining and Blue Economy, Ali Hassan Joho, ordered the immediate closure of Simba Cement quarries in Kabe Ribe, Rabai Sub-County, Kilifi County, following concerns raised by residents about quarry blasting, property damage and land acquisition practices. The directive called for compliance steps before operations could continue.</p><a href="https://ntvkenya.co.ke/news/cs-joho-orders-closure-of-simba-cement-quarries-in-rabai/" target="_blank" rel="noopener" class="btn outline" style="margin-top:16px">READ SOURCE →</a></article>
      <article class="news-card" style="padding:28px"><small>25 JULY 2026 · MANUFACTURING</small><h3>Devki Group's KSh45 billion clinker plant strengthens Simba Cement supply chain</h3><p>A new Cemtech Sebit clinkerisation plant in West Pokot, operated by National Cement Company Limited, the manufacturer of Simba Cement, was reported as a major investment aimed at increasing local clinker production, reducing dependence on imports and supporting regional exports.</p><a href="https://theweeklyvisionews.net/2026/07/25/kenyas-clinker-revolution-devki-groups-west-pokot-plant-positions-country-for-self-sufficiency-and-regional-exports/" target="_blank" rel="noopener" class="btn outline" style="margin-top:16px">READ SOURCE →</a></article>
      <article class="news-card" style="padding:28px"><small>22 JUNE 2026 · COMPANY VISIT</small><h3>India's High Commissioner visits Cemtech Eldoret</h3><p>The High Commissioner of India to Kenya visited Cemtech Eldoret, a Devki Group manufacturing subsidiary associated with Simba Cement. The visit highlighted local manufacturing, industrialisation, employment and sustainable economic growth.</p><a href="https://cemtechlimited.com/2026/06/22/high-commissioner-of-india-to-kenya-visits-cemtech-eldoret-simba-cement/" target="_blank" rel="noopener" class="btn outline" style="margin-top:16px">READ SOURCE →</a></article>
    </div></div></section>
'''

          # Replace the existing News & Updates section, with no images.
          html, n_news = re.subn(
              r'\s*<section id="news">.*?</section>\s*',
              '\n' + news,
              html, count=1, flags=re.S|re.I
          )
          if n_news != 1:
              raise SystemExit(f'News section replacement failed: found {n_news}')

          checks = [
              'PROJECTS</a>' not in html.upper(),
              'id="projects"' not in html.lower(),
              'Latest Simba Cement updates.' in html,
              'Government orders closure of Simba Cement quarries in Rabai' in html,
              "Devki Group's KSh45 billion clinker plant strengthens Simba Cement supply chain" in html,
              "India's High Commissioner visits Cemtech Eldoret" in html,
              'news-photo' not in html[html.find('<section id="news">'):html.find('<section id="news">') + html[html.find('<section id="news">'):].find('</section>')],
          ]
          print('VALIDATION:', checks)
          if not all(checks):
              raise SystemExit('Site update validation failed')

          p.write_text(html, encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Update Simba Cement news and remove Projects section'
          git push origin main
