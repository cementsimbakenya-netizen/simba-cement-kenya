name: Final site configuration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore complete site and apply final configuration
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path
          p = Path('index.html')
          html = subprocess.check_output(
              ['git','show','b2825db396853ce6d5b3d7c6af04be712a925024:index.html'],
              text=True, encoding='utf-8'
          )

          # Current supplied logo.
          html = html.replace(
              'https://i.postimg.cc/CKSsrtbF/Screenshot-2026-09-01-142431.png',
              'https://i.postimg.cc/RhRx14Vm/Screenshot-2026-09-02-151638.png'
          )

          # Remove WHERE TO BUY completely.
          html = html.replace('<a class="btn" href="#shop">📍 WHERE TO BUY</a>', '')

          # Remove PROJECTS navigation and the entire PROJECTS section completely.
          html = html.replace('<a href="#projects">PROJECTS</a>', '')
          html, removed_projects = re.subn(
              r'\s*<section class="projects" id="projects">.*?</section>\s*',
              '\n',
              html,
              count=1,
              flags=re.S
          )

          # Replace the old News & Updates section with current, text-only updates. No images.
          news_section = '''
    <section id="news"><div class="container"><div class="section-head"><div class="eyebrow">NEWS & UPDATES</div><h2>Latest Simba Cement updates.</h2><div class="redline"></div><p>Recent company-related and site updates gathered from public sources.</p></div><div class="news-grid" style="grid-template-columns:repeat(3,1fr)">
      <article class="news-card" style="padding:28px;display:flex;flex-direction:column;justify-content:space-between"><div><small>COMPANY NEWS · JUNE 22, 2026</small><h3>India’s High Commissioner visits Cemtech Eldoret</h3><p>The High Commissioner of India to Kenya visited Cemtech Eldoret, a Devki Group manufacturing operation associated with the Simba Cement business. The visit highlighted local manufacturing, industrialisation, employment and sustainable economic growth.</p></div><a href="https://cemtechlimited.com/2026/06/22/high-commissioner-of-india-to-kenya-visits-cemtech-eldoret-simba-cement/" target="_blank" rel="noopener" class="btn outline" style="align-self:flex-start;margin-top:18px">READ SOURCE →</a></article>
      <article class="news-card" style="padding:28px;display:flex;flex-direction:column;justify-content:space-between"><div><small>INDUSTRY NEWS · AUGUST 28, 2026</small><h3>Devki Group expands cement manufacturing footprint</h3><p>Recent reporting says Devki Group’s National Cement business, which operates under the Simba Cement brand, remains part of major cement-industry expansion across East Africa.</p></div><a href="https://signstv.co.ke/three-tycoons-commit-sh133-billion-to-east-africas-cement-expansion" target="_blank" rel="noopener" class="btn outline" style="align-self:flex-start;margin-top:18px">READ SOURCE →</a></article>
      <article class="news-card" style="padding:28px;display:flex;flex-direction:column;justify-content:space-between"><div><small>OFFICIAL COMPANY NEWS ROOM</small><h3>National Cement publishes Simba Cement news and events</h3><p>The official National Cement news room carries Simba Cement-related company updates, including the Nakuru Grinding Plant and wider manufacturing developments.</p></div><a href="https://nccke.com/news-room/" target="_blank" rel="noopener" class="btn outline" style="align-self:flex-start;margin-top:18px">OFFICIAL NEWS ROOM →</a></article>
    </div></div></section>
'''
          html, news_replaced = re.subn(
              r'\s*<section id="news">.*?</section>\s*',
              '\n' + news_section,
              html,
              count=1,
              flags=re.S
          )

          # Authoritative hero and header styling.
          hero_css = '''<style id="reference-hero-final">
          .hero-carousel{height:650px!important;min-height:650px!important;max-height:650px!important;overflow:hidden!important}
          .hero-carousel .hero-slide{inset:0!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important}
          .hero-carousel .hero-slide:after{background:linear-gradient(90deg,rgba(255,255,255,.70) 0%,rgba(255,255,255,.42) 30%,rgba(255,255,255,.08) 62%,rgba(18,26,34,.02) 100%)!important}
          .hero-carousel .hero-overlay{display:none!important}
          .hero-carousel .hero-arrow,.hero-carousel .hero-dots{display:none!important}
          .hero-carousel .hero-content{height:100%!important;display:flex!important;align-items:center!important}
          .hero-carousel .hero-inner{padding:65px 0!important}
          @media(max-width:900px){.hero-carousel{height:620px!important;min-height:620px!important;max-height:620px!important}.hero-carousel .hero-slide:after{background:linear-gradient(180deg,rgba(255,255,255,.70) 0%,rgba(255,255,255,.34) 55%,rgba(255,255,255,.06) 100%)!important}}
          @media(max-width:600px){.hero-carousel{height:600px!important;min-height:600px!important;max-height:600px!important}}
          </style>'''
          header_css = '''<style id="final-header-logo">
          .logo{min-width:270px!important;width:270px!important;height:82px!important;display:flex!important;align-items:center!important;background:#fff!important;border:0!important;box-shadow:none!important;overflow:hidden!important}
          .logo-img{width:270px!important;height:82px!important;display:block!important;object-fit:contain!important;object-position:left center!important;background:#fff!important;border:0!important;box-shadow:none!important;transform:none!important}
          header .nav>.btn{display:none!important}
          @media(max-width:900px){
            header .nav{height:70px!important;justify-content:space-between!important}
            .logo{min-width:0!important;width:calc(100% - 58px)!important;height:70px!important}
            .logo-img{width:100%!important;height:70px!important;object-fit:contain!important;object-position:left center!important}
            .hamb{display:block!important;margin-left:auto!important;font-size:28px!important;background:none!important;border:0!important}
          }
          </style>'''
          solutions_css = '''<style id="solutions-words-only">
          #solutions .solutions-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:0!important;background:#171717!important}
          #solutions .solution{height:210px!important;background-image:none!important;background:#171717!important;display:flex!important;align-items:center!important;justify-content:center!important;position:relative!important;border-right:1px solid rgba(255,255,255,.16)!important}
          #solutions .solution:last-child{border-right:0!important}
          #solutions .solution:after{display:none!important}
          #solutions .solution h3{position:static!important;margin:0!important;color:#fff!important;text-align:center!important;font-size:18px!important;line-height:1.2!important;letter-spacing:.8px!important}
          @media(max-width:900px){#solutions .solutions-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}#solutions .solution{height:150px!important}}
          @media(max-width:560px){#solutions .solutions-grid{grid-template-columns:1fr!important}#solutions .solution{height:110px!important;border-right:0!important;border-bottom:1px solid rgba(255,255,255,.16)!important}}
          </style>'''

          # Remove duplicate copies of our authoritative style blocks if they exist in the base.
          for marker in ['fullscreen-hero-carousel','final-hero-layout','final-header-logo','reference-hero-final','solutions-words-only']:
              while f'id="{marker}"' in html:
                  start = html.find(f'<style id="{marker}">')
                  if start == -1:
                      break
                  end = html.find('</style>', start)
                  if end == -1:
                      break
                  html = html[:start] + html[end+len('</style>'):]

          html = html.replace('</head>', header_css + hero_css + solutions_css + '</head>', 1)
          p.write_text(html, encoding='utf-8')

          checks = [
              'https://i.postimg.cc/RhRx14Vm/Screenshot-2026-09-02-151638.png' in html,
              'href="#shop">📍 WHERE TO BUY' not in html,
              'BUILT TO LAST.' in html,
              'Simba Cement 32.5R' in html,
              'Barbed Wire 240mts' in html,
              'Barbed Wire 480mts' in html,
              'Barbed Wire 610mts' in html,
              'Paving Blocks [600mm]' in html,
              'BUILDING KENYA, ONE PROJECT AT A TIME.' in html,
              'Latest Simba Cement updates.' in html,
              'India’s High Commissioner visits Cemtech Eldoret' in html,
              'Devki Group expands cement manufacturing footprint' in html,
              'National Cement publishes Simba Cement news and events' in html,
              'id="projects"' not in html,
              'PROJECTS</a>' not in html,
          ]
          print('FINAL CHECKS:', checks, 'removed_projects=', removed_projects, 'news_replaced=', news_replaced)
          if not all(checks):
              raise SystemExit('Final site configuration validation failed')

      - name: Commit final site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add latest text-only news and remove Projects section'
          git push origin main
