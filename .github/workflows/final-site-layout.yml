name: Final site layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          html = html.replace(
              '<p>Our core range of building and construction materials. Browse here while you scroll, or open the full shop to build your order.</p>',
              ''
          )

          css = '''\n<style id="final-hero-layout">\n.hero-carousel{min-height:760px!important}\n.hero-carousel .hero-arrow,.hero-carousel .hero-dots{display:none!important}\n@media(max-width:900px){.hero-carousel{min-height:690px!important}}\n@media(max-width:600px){.hero-carousel{min-height:720px!important}}\n</style>\n<style id="solutions-words-only">\n#solutions .solutions-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:0!important;background:#171717!important}\n#solutions .solution{height:210px!important;background-image:none!important;background:#171717!important;display:flex!important;align-items:center!important;justify-content:center!important;position:relative!important;border-right:1px solid rgba(255,255,255,.16)!important}\n#solutions .solution:last-child{border-right:0!important}\n#solutions .solution:after{display:none!important}\n#solutions .solution h3{position:static!important;margin:0!important;color:#fff!important;text-align:center!important;font-size:18px!important;line-height:1.2!important;letter-spacing:.8px!important}\n@media(max-width:900px){#solutions .solutions-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}#solutions .solution{height:150px!important}}\n@media(max-width:560px){#solutions .solutions-grid{grid-template-columns:1fr!important}#solutions .solution{height:110px!important;border-right:0!important;border-bottom:1px solid rgba(255,255,255,.16)!important}}\n</style>\n'''
          for marker in ['final-hero-layout','solutions-words-only']:
              start = html.find(f'<style id="{marker}">')
              if start != -1:
                  end = html.find('</style>', start) + len('</style>')
                  html = html[:start] + html[end:]
          html = html.replace('</head>', css + '</head>', 1)

          p.write_text(html, encoding='utf-8')

          checks = [
              'BUILT TO LAST.' in html,
              'Simba Cement 32.5R' in html,
              'Chainlink 4ft × 18mts' in html,
              'Barbed Wire 240mts' in html,
              'Barbed Wire 480mts' in html,
              'Barbed Wire 610mts' in html,
              'Paving Blocks [600mm]' in html,
              'BUILDING KENYA, ONE PROJECT AT A TIME.' in html,
              'final-hero-layout' in html,
              'solutions-words-only' in html,
          ]
          print('FINAL CHECKS:', checks)
          if not all(checks):
              raise SystemExit('Final site validation failed')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Make Solutions section words only'
          git push origin main
