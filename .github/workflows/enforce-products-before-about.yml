name: Enforce Products before About Us

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reorder homepage sections
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def block(text, section_id):
              pattern = re.compile(
                  rf'<section\b[^>]*\bid=[\"\']{re.escape(section_id)}[\"\'][^>]*>.*?</section>',
                  re.S | re.I,
              )
              m = pattern.search(text)
              if not m:
                  raise SystemExit(f'Missing #{section_id} section')
              return m

          about = block(s, 'about')
          products = block(s, 'products')

          # Put Products immediately before About Us.
          if products.start() > about.start():
              products_text = products.group(0)
              about_text = about.group(0)
              left = s[:about.start()]
              middle = s[about.end():products.start()]
              right = s[products.end():]
              s = left + products_text + middle + about_text + right

          # Remove the retired feature strip completely.
          feature = re.search(r'<section\b[^>]*class=[\"\']feature[\"\'][^>]*>.*?</section>', s, re.S | re.I)
          if feature:
              s = s[:feature.start()] + s[feature.end():]

          p.write_text(s, encoding='utf-8')

      - name: Commit enforced order
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage order change needed.'
          else
            git commit -m 'Place Products before About Us'
            git push
          fi
