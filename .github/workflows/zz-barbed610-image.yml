name: Add supplied Barbed Wire 610mts image

on:
  workflow_run:
    workflows: ["Lock supplied Chainlink image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-barbed610-image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set supplied Barbed Wire 610mts photo
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          image = 'https://i.postimg.cc/sDdq0ddt/Screenshot-2026-09-02-135513.png'

          # Replace any Barbed Wire 610mts placeholder card with the supplied photo.
          s, n = re.subn(
              r'<div class="reference-product-image reference-product-placeholder"><span>BARBED WIRE<br>610 M</span></div>',
              f'<div class="reference-product-image"><img src="{image}" alt="Barbed Wire 610mts"></div>',
              s
          )

          # Also handle a card that may already have the correct product heading but a placeholder image.
          if n == 0:
              s, n = re.subn(
                  r'(<h3>Barbed Wire 610mts</h3>.*?<div class="reference-product-image )reference-product-placeholder(.*?</div>)',
                  rf'\1\2',
                  s,
                  flags=re.S
              )

          p.write_text(s, encoding='utf-8')
          print('BARBED610_IMAGE=', image)
          print('BARBED610_PRESENT=', image in s)
          print('BARBED610_HEADING=', 'Barbed Wire 610mts' in s)

      - name: Commit image update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Barbed Wire 610mts image already applied.'
          else
            git commit -m 'Set Barbed Wire 610mts supplied image'
            git push origin main
          fi
