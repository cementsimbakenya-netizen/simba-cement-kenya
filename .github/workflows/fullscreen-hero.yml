name: Fullscreen hero carousel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply reference-style hero carousel
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          css = '''<style id="fullscreen-hero-carousel">
          /* Match the supplied reference: large hero image, but not a giant browser-height panel. */
          .hero-carousel{
            height:650px!important;
            min-height:650px!important;
            max-height:650px!important;
            overflow:hidden!important;
          }
          .hero-carousel .hero-slide{
            position:absolute!important;
            inset:0!important;
            background-size:cover!important;
            background-position:center center!important;
            background-repeat:no-repeat!important;
          }
          /* Remove the extra overlay layer that was washing the photographs out. */
          .hero-carousel .hero-slide:after{background:linear-gradient(90deg,rgba(255,255,255,.70) 0%,rgba(255,255,255,.42) 30%,rgba(255,255,255,.08) 62%,rgba(18,26,34,.02) 100%)!important}
          .hero-carousel .hero-overlay{display:none!important}
          .hero-carousel .hero-arrow,.hero-carousel .hero-dots{display:none!important}
          .hero-carousel .hero-content{height:100%!important;display:flex!important;align-items:center!important}
          .hero-carousel .hero-inner{padding:65px 0!important}
          @media(max-width:900px){
            .hero-carousel{height:620px!important;min-height:620px!important;max-height:620px!important}
            .hero-carousel .hero-slide:after{background:linear-gradient(180deg,rgba(255,255,255,.70) 0%,rgba(255,255,255,.34) 55%,rgba(255,255,255,.06) 100%)!important}
          }
          @media(max-width:600px){
            .hero-carousel{height:600px!important;min-height:600px!important;max-height:600px!important}
          }
          </style>'''
          marker='id="fullscreen-hero-carousel"'
          if marker in html:
              start=html.find('<style id="fullscreen-hero-carousel">')
              end=html.find('</style>',start)+len('</style>')
              html=html[:start]+css+html[end:]
          else:
              html=html.replace('</head>',css+'</head>',1)
          checks=[
              'height:650px!important' in html,
              'background-size:cover!important' in html,
              'hero-carousel .hero-arrow,.hero-carousel .hero-dots{display:none!important}' in html,
              'hero-carousel .hero-overlay{display:none!important}' in html,
          ]
          print('HERO CHECKS:',checks)
          if not all(checks):
              raise SystemExit('Reference-style hero validation failed')
          p.write_text(html,encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Match hero carousel to supplied reference'
          git push origin main
