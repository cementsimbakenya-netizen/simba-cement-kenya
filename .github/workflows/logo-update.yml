name: Apply supplied Simba Cement logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace header logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a class="logo" href="#home" aria-label="Simba Cement home"><div class="lion">♛</div><div class="brand"><b>SIMBA</b><span>CEMENT</span><small>STRENGTH WITHIN</small></div></a>'
          new = '<a class="logo" href="#home" aria-label="Simba Cement home"><img src="https://i.postimg.cc/CKSsrtbF/Screenshot-2026-09-01-142431.png" alt="Simba Cement" class="logo-img"></a>'
          if old in s:
              s = s.replace(old, new, 1)
          if '.logo-img{' not in s:
              s = s.replace('.logo{display:flex;align-items:center;gap:10px;min-width:190px}', '.logo{display:flex;align-items:center;gap:10px;min-width:190px}.logo-img{width:190px;height:58px;object-fit:contain;object-position:left center;display:block}', 1)
          p.write_text(s)
          PY

      - name: Commit logo update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Logo already applied."
          else
            git commit -m "Use supplied Simba Cement logo [skip ci]"
            git push
          fi
