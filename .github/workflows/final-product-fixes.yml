name: Apply supplied Barbed Wire 480mts photo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-product:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact Barbed Wire 480mts image
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          heading = 'Barbed Wire 480mts'
          image = 'https://i.postimg.cc/8PXWzDkP/Screenshot-2026-09-02-135758.png'

          h3 = f'<h3>{heading}</h3>'
          pos = html.find(h3)
          if pos < 0:
              raise SystemExit('Barbed Wire 480mts heading not found in index.html')

          card_start = html.rfind('<article class="reference-product-card', 0, pos)
          card_end = html.find('</article>', pos)
          if card_start < 0 or card_end < 0:
              raise SystemExit('Barbed Wire 480mts product card not found')
          card_end += len('</article>')

          card = html[card_start:card_end]
          image_container = re.compile(
              r'<div class="reference-product-image(?: reference-product-placeholder)?">.*?</div>',
              re.S,
          )
          replacement = (
              f'<div class="reference-product-image">'
              f'<img src="{image}" alt="{heading}">'
              f'</div>'
          )
          updated, count = image_container.subn(replacement, card, count=1)
          if count != 1:
              raise SystemExit('Barbed Wire 480mts image container not found')

          html = html[:card_start] + updated + html[card_end:]
          path.write_text(html, encoding='utf-8')

          verify = path.read_text(encoding='utf-8')
          checks = [
              f'src="{image}"' in verify,
              heading in verify,
              'reference-product-placeholder' not in updated,
          ]
          print('BARBED WIRE 480MTS CHECKS:', checks)
          if not all(checks):
              raise SystemExit(f'Validation failed: {checks}')

      - name: Commit if needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Barbed Wire 480mts image is already present in the source.'
            exit 0
          fi
          git commit -m 'Add Barbed Wire 480mts product image'
          git push origin main
