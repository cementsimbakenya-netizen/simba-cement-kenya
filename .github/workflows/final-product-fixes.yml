name: Apply supplied product photos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-products:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact supplied product images
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          updates = {
              'Barbed Wire 240mts': 'https://i.postimg.cc/tggVQ4Vn/Screenshot-2026-09-02-144319.png',
              'Barbed Wire 480mts': 'https://i.postimg.cc/8PXWzDkP/Screenshot-2026-09-02-135758.png',
              'Barbed Wire 610mts': 'https://i.postimg.cc/sDdq0ddt/Screenshot-2026-09-02-135513.png',
              'Paving Blocks [600mm]': 'https://i.postimg.cc/Jh3YgKZt/Screenshot-2026-09-02-144841.png',
          }

          for heading, image in updates.items():
              marker = f'<h3>{heading}</h3>'
              pos = html.find(marker)
              if pos < 0:
                  raise SystemExit(f'{heading} heading not found')

              card_start = html.rfind('<article class="reference-product-card', 0, pos)
              card_end = html.find('</article>', pos)
              if card_start < 0 or card_end < 0:
                  raise SystemExit(f'{heading} card not found')
              card_end += len('</article>')

              card = html[card_start:card_end]
              image_re = re.compile(
                  r'<div class="reference-product-image(?: reference-product-placeholder)?">.*?</div>',
                  re.S,
              )
              replacement = (
                  f'<div class="reference-product-image">'
                  f'<img src="{image}" alt="{heading}">'
                  f'</div>'
              )
              updated, count = image_re.subn(replacement, card, count=1)
              if count != 1:
                  raise SystemExit(f'{heading} image container not found')

              html = html[:card_start] + updated + html[card_end:]

          path.write_text(html, encoding='utf-8')

          verify = path.read_text(encoding='utf-8')
          for heading, image in updates.items():
              expected = f'<img src="{image}" alt="{heading}">'
              if expected not in verify:
                  raise SystemExit(f'Verification failed for {heading}')

          print('VERIFIED:', ', '.join(updates))

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Apply supplied product images'
          git push origin main
