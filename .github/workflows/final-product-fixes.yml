name: Final product fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-products:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply supplied barbed wire photos and compact steel layout
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          barbed480_image = 'https://i.postimg.cc/8PXWzDkP/Screenshot-2026-09-02-135758.png'
          barbed610_image = 'https://i.postimg.cc/sDdq0ddt/Screenshot-2026-09-02-135513.png'

          old480 = '<div class="reference-product-image reference-product-placeholder"><span>BARBED WIRE<br>480 M</span></div>'
          old610 = '<div class="reference-product-image reference-product-placeholder"><span>BARBED WIRE<br>610 M</span></div>'
          new480 = f'<div class="reference-product-image"><img src="{barbed480_image}" alt="Barbed Wire 480mts"></div>'
          new610 = f'<div class="reference-product-image"><img src="{barbed610_image}" alt="Barbed Wire 610mts"></div>'

          if old480 not in html:
              raise SystemExit('Barbed Wire 480mts placeholder not found')
          if old610 not in html:
              raise SystemExit('Barbed Wire 610mts placeholder not found')

          html = html.replace(old480, new480, 1)
          html = html.replace(old610, new610, 1)

          css = '''<style id="simba-final-product-fixes">
          #products .reference-steel-list{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;margin-top:12px!important;min-width:0!important}
          #products .reference-steel-list>div{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto!important;gap:5px!important;align-items:center!important;min-width:0!important;padding:5px 6px!important;border:1px solid #e3e7eb!important;border-radius:4px!important;background:#fafafa!important;overflow:hidden!important}
          #products .reference-steel-list strong{font-size:11px!important;line-height:1!important;white-space:nowrap!important}
          #products .reference-steel-list span{font-size:10px!important;line-height:1!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;min-width:0!important}
          #products .reference-steel-list button{font-size:9px!important;line-height:1!important;padding:4px 6px!important;min-width:0!important;min-height:0!important;white-space:nowrap!important;border:1px solid #d92a37!important;background:#fff!important;color:#c91f2d!important}
          #products .reference-product-image img{width:100%!important;height:100%!important;display:block!important;object-fit:contain!important;object-position:center!important;background:#fff!important}
          @media(max-width:560px){#products .reference-steel-list{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important}#products .reference-steel-list>div{gap:3px!important;padding:4px 5px!important}#products .reference-steel-list strong{font-size:9px!important}#products .reference-steel-list span{font-size:8px!important}#products .reference-steel-list button{font-size:8px!important;padding:3px 5px!important}}
          </style>'''

          html = re.sub(r'<style id="simba-final-product-fixes">.*?</style>', '', html, flags=re.S | re.I)
          html = html.replace('</body>', css + '\n</body>', 1)

          checks = [barbed480_image in html, barbed610_image in html, old480 not in html, old610 not in html]
          if not all(checks):
              raise SystemExit(f'Validation failed: {checks}')
          print('PRODUCT IMAGE FIXES VALIDATED', checks)

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Apply supplied Barbed Wire photos'
            git push origin main
          fi
