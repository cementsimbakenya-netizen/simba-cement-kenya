name: Final product fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-products:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply supplied product images and compact steel layout
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          chainlink_image = 'https://i.postimg.cc/L4f8GpwL/Screenshot-2026-09-02-133720.png'
          barbed610_image = 'https://i.postimg.cc/sDdq0ddt/Screenshot-2026-09-02-135513.png'
          barbed480_image = 'https://i.postimg.cc/8PXWzDkP/Screenshot-2026-09-02-135758.png'

          def replace_placeholder_card(source, heading, image, alt):
              start = source.find('<article class="reference-product-card">', source.find('<h3>' + heading + '</h3>') - 1200)
              if start < 0:
                  start = source.find('<article class="reference-product-card">')
              if start < 0:
                  raise SystemExit(f'Product card start not found: {heading}')
              end = source.find('</article>', start)
              if end < 0:
                  raise SystemExit(f'Product card end not found: {heading}')
              end += len('</article>')
              card = source[start:end]
              if '<h3>' + heading + '</h3>' not in card:
                  raise SystemExit(f'Product card not found: {heading}')
              new = f'<div class="reference-product-image"><img src="{image}" alt="{alt}"></div>'
              updated, changed = re.subn(
                  r'<div class="reference-product-image(?: reference-product-placeholder)?">.*?</div>',
                  new,
                  card,
                  count=1,
                  flags=re.S,
              )
              if changed != 1:
                  raise SystemExit(f'Product image placeholder not found: {heading}')
              return source[:start] + updated + source[end:]

          for heading in [
              'Chainlink 4ft × 18mts',
              'Chainlink 5ft × 18mts',
              'Chainlink 6ft × 18mts',
              'Chainlink 7ft × 18mts',
          ]:
              # These already have a real image; this keeps them locked to the supplied chainlink photo.
              pattern = re.compile(r'(<article class="reference-product-card">.*?<h3>' + re.escape(heading) + r'</h3>.*?</article>)', re.S)
              m = pattern.search(html)
              if not m:
                  raise SystemExit(f'Chainlink card not found: {heading}')
              card = m.group(1)
              card = re.sub(r'<div class="reference-product-image(?: reference-product-placeholder)?">.*?</div>', f'<div class="reference-product-image"><img src="{chainlink_image}" alt="{heading}"></div>', card, count=1, flags=re.S)
              html = html[:m.start(1)] + card + html[m.end(1):]

          html = replace_placeholder_card(html, 'Barbed Wire 480mts', barbed480_image, 'Barbed Wire 480mts')
          html = replace_placeholder_card(html, 'Barbed Wire 610mts', barbed610_image, 'Barbed Wire 610mts')

          css = '''<style id="simba-final-product-fixes">
          #products .reference-steel-list{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;margin-top:12px!important;min-width:0!important}
          #products .reference-steel-list>div{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto!important;gap:5px!important;align-items:center!important;min-width:0!important;padding:5px 6px!important;border:1px solid #e3e7eb!important;border-radius:4px!important;background:#fafafa!important;overflow:hidden!important}
          #products .reference-steel-list strong{font-size:11px!important;line-height:1!important;white-space:nowrap!important}
          #products .reference-steel-list span{font-size:10px!important;line-height:1!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;min-width:0!important}
          #products .reference-steel-list button{font-size:9px!important;line-height:1!important;padding:4px 6px!important;min-width:0!important;min-height:0!important;white-space:nowrap!important;border:1px solid #d92a37!important;background:#fff!important;color:#c91f2d!important}
          #products .reference-product-image img{width:100%!important;height:100%!important;display:block!important;object-fit:contain!important;object-position:center!important;background:#fff!important}
          @media(max-width:560px){#products .reference-steel-list{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important}#products .reference-steel-list>div{gap:3px!important;padding:4px 5px!important}#products .reference-steel-list strong{font-size:9px!important}#products .reference-steel-list span{font-size:8px!important}#products .reference-steel-list button{font-size:8px!important;padding:3px 5px!important}}
          </style>'''

          html = re.sub(r'<style id="simba-final-product-fixes">.*?</style>', '', html, flags=re.S | re.I)
          html = html.replace('</body>', css + '\n</body>', 1) if '</body>' in html else html + css

          checks = [
              html.count(chainlink_image) >= 4,
              barbed480_image in html,
              barbed610_image in html,
              'Barbed Wire 480mts' in html,
              'Barbed Wire 610mts' in html,
              'simba-final-product-fixes' in html,
          ]
          if not all(checks):
              raise SystemExit(f'Validation failed: {checks}')
          print('FINAL PRODUCT FIXES VALIDATED', checks)

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Apply supplied product photos and compact steel layout'
            git push origin main
          fi
