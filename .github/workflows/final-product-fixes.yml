name: Final product fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-products:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply supplied product photos directly to cards
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          photos = {
              'Barbed Wire 480mts': 'https://i.postimg.cc/8PXWzDkP/Screenshot-2026-09-02-135758.png',
              'Barbed Wire 610mts': 'https://i.postimg.cc/sDdq0ddt/Screenshot-2026-09-02-135513.png',
          }

          def replace_card_photo(source, heading, image):
              marker = '<h3>' + heading + '</h3>'
              h3 = source.find(marker)
              if h3 < 0:
                  raise SystemExit(f'Heading not found: {heading}')

              start = source.rfind('<article class="reference-product-card"', 0, h3)
              if start < 0:
                  raise SystemExit(f'Card start not found: {heading}')

              end = source.find('</article>', h3)
              if end < 0:
                  raise SystemExit(f'Card end not found: {heading}')
              end += len('</article>')

              card = source[start:end]
              image_re = re.compile(r'<div class="reference-product-image(?: reference-product-placeholder)?">.*?</div>', re.S)
              replacement = f'<div class="reference-product-image"><img src="{image}" alt="{heading}"></div>'
              updated, count = image_re.subn(replacement, card, count=1)
              if count != 1:
                  raise SystemExit(f'Image container not found: {heading}')
              return source[:start] + updated + source[end:]

          for heading, image in photos.items():
              html = replace_card_photo(html, heading, image)

          # Leave a deterministic marker so every successful run produces a real commit.
          marker = '<!-- supplied-product-photos-locked -->'
          html = re.sub(r'\s*<!-- supplied-product-photos-locked -->', '', html)
          html = html.replace('</body>', marker + '\n</body>', 1)

          checks = [
              'src="' + photos['Barbed Wire 480mts'] + '"' in html,
              'src="' + photos['Barbed Wire 610mts'] + '"' in html,
              marker in html,
          ]
          if not all(checks):
              raise SystemExit(f'Validation failed: {checks}')
          print('BARBED WIRE PRODUCT PHOTOS VERIFIED:', checks)

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply supplied Barbed Wire product photos'
          git push origin main
