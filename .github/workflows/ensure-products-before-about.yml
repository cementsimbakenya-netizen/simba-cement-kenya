name: Ensure Products Before About

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ensure-products-before-about.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure homepage order
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def get_section(text, section_id):
              marker = 'id="' + section_id + '"'
              marker_pos = text.find(marker)
              if marker_pos < 0:
                  raise SystemExit('Missing section: ' + section_id)
              start = text.rfind('<section', 0, marker_pos + 1)
              if start < 0:
                  raise SystemExit('Missing section start: ' + section_id)
              depth = 0
              pos = start
              while True:
                  next_open = text.find('<section', pos)
                  next_close = text.find('</section>', pos)
                  if next_close < 0:
                      raise SystemExit('Missing section close: ' + section_id)
                  if next_open != -1 and next_open < next_close:
                      depth += 1
                      pos = next_open + len('<section')
                  else:
                      depth -= 1
                      pos = next_close + len('</section>')
                      if depth == 0:
                          return start, pos

          about_start, about_end = get_section(s, 'about')
          products_start, products_end = get_section(s, 'products')

          if products_start > about_start:
              products = s[products_start:products_end]
              s = s[:products_start] + s[products_end:]
              about_start, about_end = get_section(s, 'about')
              s = s[:about_start] + products + '\n' + s[about_start:]
              p.write_text(s, encoding='utf-8')

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Products is already before About Us.'
          else
            git commit -m 'Place Products before About Us'
            git push
          fi
