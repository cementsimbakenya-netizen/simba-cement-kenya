name: Deploy Simba Cement site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove Projects copy and apply final page content
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Remove all Projects navigation links.
          html = re.sub(r'<a\b[^>]*href=["\']#projects["\'][^>]*>.*?</a>', '', html, flags=re.I|re.S)

          # Remove the complete Projects section, regardless of attribute order.
          html, n = re.subn(
              r'\s*<section\b(?=[^>]*\bid=["\']projects["\'])(?=[^>]*\bclass=["\']projects["\'])[^>]*>.*?</section>\s*',
              '\n', html, count=1, flags=re.I|re.S
          )
          if n != 1:
              html, n = re.subn(
                  r'\s*<section\b(?=[^>]*\bid=["\']projects["\'])[^>]*>.*?</section>\s*',
                  '\n', html, count=1, flags=re.I|re.S
              )

          # Remove the old portfolio copy even if the section wrapper has already gone.
          for text in [
              'Built around real construction needs.',
              'Use this section for verified project photography and case studies as the portfolio grows.',
              'RESIDENTIAL DEVELOPMENT',
              'COMMERCIAL BUILDING',
              'STRUCTURAL WORKS',
          ]:
              html = html.replace(text, '')

          # Remove standalone Kenya labels left behind by the deleted project cards.
          html = re.sub(r'(<(?:p|span|small|div)\b[^>]*>)\s*Kenya\s*(</(?:p|span|small|div)>)', r'\1\2', html, flags=re.I)

          # Replace News & Updates with text-only current items.
          news = '''
          <section id="news">
            <div class="container">
              <div class="section-head">
                <div class="eyebrow">NEWS &amp; UPDATES</div>
                <h2>Latest Simba Cement updates.</h2>
                <div class="redline"></div>
                <p>Recent public updates connected to Simba Cement and National Cement Company Limited.</p>
              </div>
              <div class="news-grid">
                <article class="news-card" style="padding:28px">
                  <small>7 AUGUST 2026 · INDUSTRY &amp; OPERATIONS</small>
                  <h3>Government orders closure of Simba Cement quarries in Rabai</h3>
                  <p>Kenya's Cabinet Secretary for Mining and Blue Economy, Ali Hassan Joho, ordered the immediate closure of Simba Cement quarries in Kabe Ribe, Rabai Sub-County, Kilifi County, following concerns raised by residents about quarry blasting, property damage and land acquisition practices.</p>
                  <a href="https://ntvkenya.co.ke/news/cs-joho-orders-closure-of-simba-cement-quarries-in-rabai/" target="_blank" rel="noopener" class="btn outline" style="margin-top:16px">READ SOURCE →</a>
                </article>
                <article class="news-card" style="padding:28px">
                  <small>25 JULY 2026 · MANUFACTURING</small>
                  <h3>Devki Group's KSh45 billion clinker plant strengthens local supply</h3>
                  <p>A new Cemtech Sebit clinkerisation plant in West Pokot, operated by National Cement Company Limited, the manufacturer of Simba Cement, was reported as a major investment aimed at increasing local clinker production, reducing dependence on imports and supporting regional exports.</p>
                  <a href="https://theweeklyvisionews.net/2026/07/25/kenyas-clinker-revolution-devki-groups-west-pokot-plant-positions-country-for-self-sufficiency-and-regional-exports/" target="_blank" rel="noopener" class="btn outline" style="margin-top:16px">READ SOURCE →</a>
                </article>
                <article class="news-card" style="padding:28px">
                  <small>22 JUNE 2026 · COMPANY VISIT</small>
                  <h3>India's High Commissioner visits Cemtech Eldoret</h3>
                  <p>The High Commissioner of India to Kenya visited Cemtech Eldoret, a Devki Group manufacturing subsidiary associated with Simba Cement. The visit highlighted local manufacturing, industrialisation, employment and sustainable economic growth.</p>
                  <a href="https://cemtechlimited.com/2026/06/22/high-commissioner-of-india-to-kenya-visits-cemtech-eldoret-simba-cement/" target="_blank" rel="noopener" class="btn outline" style="margin-top:16px">READ SOURCE →</a>
                </article>
              </div>
            </div>
          </section>
          '''

          html, news_n = re.subn(
              r'\s*<section\b[^>]*id=["\']news["\'][^>]*>.*?</section>\s*',
              '\n' + news + '\n',
              html, count=1, flags=re.I|re.S
          )
          if news_n != 1:
              raise SystemExit(f'News section was not found for replacement: {news_n}')

          # Remove obsolete project styling so no blank portfolio block remains.
          html = re.sub(r'\.projects\{[^}]*\}', '', html)
          html = re.sub(r'\.project-grid\{[^}]*\}', '', html)
          html = re.sub(r'\.project\{[^}]*\}', '', html)
          html = re.sub(r'\.project:after\{[^}]*\}', '', html)
          html = re.sub(r'\.project div\{[^}]*\}', '', html)
          html = re.sub(r'\.project:nth-child\(\d+\)\{[^}]*\}', '', html)

          lower = html.lower()
          forbidden = [
              'id="projects"',
              'href="#projects"',
              'built around real construction needs.',
              'residential development',
              'commercial building',
              'structural works',
          ]
          checks = [
              '<section id="news">' in lower,
              'latest simba cement updates.' in lower,
              all(x not in lower for x in forbidden),
          ]
          print('FINAL PAGE CHECKS:', checks)
          if not all(checks):
              raise SystemExit('Final page validation failed')

          p.write_text(html.rstrip() + '\n', encoding='utf-8')

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
