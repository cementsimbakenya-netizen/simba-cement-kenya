name: Deploy Simba Cement site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build final pages
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          # Projects: remove nav links and the entire section from the actual published HTML.
          h=re.sub(r'<a\b[^>]*href=["\']#projects["\'][^>]*>.*?</a>','',h,flags=re.I|re.S)
          h=re.sub(r'<section\b[^>]*id=["\']projects["\'][^>]*>.*?</section>','',h,count=1,flags=re.I|re.S)
          for x in ('PROJECTS','Built around real construction needs.','Use this section for verified project photography and case studies as the portfolio grows.','RESIDENTIAL DEVELOPMENT','COMMERCIAL BUILDING','STRUCTURAL WORKS'):
              h=h.replace(x,'')
          # News: replace old image cards with text-only current items.
          news='''<section id="news"><div class="container"><div class="section-head"><div class="eyebrow">NEWS &amp; UPDATES</div><h2>Latest Simba Cement updates.</h2><div class="redline"></div><p>Recent public updates connected to Simba Cement and National Cement Company Limited.</p></div><div class="news-grid"><article class="news-card" style="padding:28px"><small>7 AUGUST 2026 · INDUSTRY &amp; OPERATIONS</small><h3>Government orders closure of Simba Cement quarries in Rabai</h3><p>Kenya's Cabinet Secretary for Mining and Blue Economy ordered the immediate closure of Simba Cement quarries in Kabe Ribe, Rabai Sub-County, Kilifi County, after concerns were raised by residents.</p><a href="https://ntvkenya.co.ke/news/cs-joho-orders-closure-of-simba-cement-quarries-in-rabai/" target="_blank" rel="noopener" class="btn outline">READ SOURCE →</a></article><article class="news-card" style="padding:28px"><small>25 JULY 2026 · MANUFACTURING</small><h3>New clinker plant strengthens local cement supply</h3><p>Reporting on Cemtech Sebit in West Pokot highlighted increased local clinker production, reduced import dependence and regional export potential.</p><a href="https://theweeklyvisionews.net/2026/07/25/kenyas-clinker-revolution-devki-groups-west-pokot-plant-positions-country-for-self-sufficiency-and-regional-exports/" target="_blank" rel="noopener" class="btn outline">READ SOURCE →</a></article><article class="news-card" style="padding:28px"><small>22 JUNE 2026 · COMPANY VISIT</small><h3>India's High Commissioner visits Cemtech Eldoret</h3><p>The visit highlighted local manufacturing, industrialisation, employment and sustainable economic growth at Cemtech Eldoret.</p><a href="https://cemtechlimited.com/2026/06/22/high-commissioner-of-india-to-kenya-visits-cemtech-eldoret-simba-cement/" target="_blank" rel="noopener" class="btn outline">READ SOURCE →</a></article></div></div></section>'''
          h=re.sub(r'<section\b[^>]*id=["\']news["\'][^>]*>.*?</section>','\n'+news+'\n',h,count=1,flags=re.I|re.S)
          # Remove all email fields from the contact form.
          h=re.sub(r'<label[^>]*>\s*Email.*?</label>','',h,flags=re.I|re.S)
          h=re.sub(r'<input[^>]*(?:type=["\']email["\']|name=["\']email["\'])[^>]*>','',h,flags=re.I|re.S)
          # Products: navigation and prominent CTA go to dedicated shop page.
          h=re.sub(r'(<a\b[^>]*href=["\'])#products(["\'][^>]*>)[^<]*</a>',r'\1shop.html\2SHOP / OUR PRODUCTS</a>',h,flags=re.I|re.S)
          h=re.sub(r'(<h2[^>]*>)\s*Our Products\s*(</h2>)',r'\1SHOP / OUR PRODUCTS\2',h,count=1,flags=re.I)
          # Exact Why Choose Us supplied image.
          h=re.sub(r'https://images\.unsplash\.com/photo-1516939884455-1445c8652f83[^\"\']*','https://i.postimg.cc/1zvgDdzS/Screenshot-2026-09-01-205904.png',h)
          inject=r'''<style id="final-modern"><style id="final-modern">.shop-hint{margin:14px 0;padding:14px 16px;border-left:4px solid #245a8d;background:#fff;color:#33404c;font-size:14px}.modern-quote-panel{position:fixed;right:20px;bottom:90px;z-index:90;width:min(390px,calc(100vw - 40px));background:#fff;border:1px solid #dfe5ea;border-radius:16px;box-shadow:0 18px 55px #0002;padding:20px;display:none}.modern-quote-panel.open{display:block}.mq-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.mq-controls{display:flex;gap:5px;align-items:center}.mq-controls button{width:30px;height:30px;border:1px solid #ccd4dc;background:#fff;border-radius:7px;font-weight:900}.customer-backdrop{position:fixed;inset:0;z-index:200;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.customer-backdrop.open{display:flex}.customer-box{width:min(480px,100%);background:#fff;border-radius:18px;padding:22px}.customer-box input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd4dc;border-radius:9px;box-sizing:border-box}.customer-actions{display:flex;gap:8px;margin-top:8px}.customer-actions button{flex:1;border:0;padding:12px;border-radius:9px;font-weight:900}.mq-send{background:#25d366;color:#fff}.mq-cancel{background:#eef2f5}@media(max-width:600px){.modern-quote-panel{right:10px;bottom:80px;width:calc(100vw - 20px)}}</style>
<script>(function(){const WA='254780079982';let cart=JSON.parse(localStorage.getItem('simbaQuoteCartV3')||'[]');const save=()=>{localStorage.setItem('simbaQuoteCartV3',JSON.stringify(cart));render()};const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function add(card){const name=card.querySelector('h3')?.textContent.trim()||'Product';const price=Number((card.querySelector('.price')?.textContent||'0').replace(/[^0-9]/g,''))||0;let x=cart.find(i=>i.name===name);if(x)x.qty++;else cart.push({name,price,qty:1});save();openPanel()}function panel(){let p=document.getElementById('modern-quote-panel');if(!p){p=document.createElement('div');p.id='modern-quote-panel';p.className='modern-quote-panel';document.body.appendChild(p)}return p}function openPanel(){render();panel().classList.add('open')}function render(){let p=panel();let total=cart.reduce((s,x)=>s+x.price*x.qty,0);p.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><strong>Your quotation</strong><button id="mq-close" style="border:0;background:none;font-size:22px">×</button></div><div>'+ (cart.length?cart.map((x,i)=>'<div class="mq-row"><div><strong>'+esc(x.name)+'</strong><div style="font-size:12px;color:#66717c">KSh '+x.price.toLocaleString()+'</div></div><div class="mq-controls"><button data-mq="-1" data-i="'+i+'">−</button><span>'+x.qty+'</span><button data-mq="1" data-i="'+i+'">+</button></div></div>').join(''):'<p style="color:#66717c">Your quotation is empty.</p>')+'</div><div style="font-size:20px;font-weight:900;margin:12px 0">Total: KSh '+total.toLocaleString()+'</div><button id="mq-send" class="modern-quote-btn" style="width:100%;border:0;background:#245a8d;color:#fff;padding:13px;border-radius:10px;font-weight:900">GET QUOTATION ON WHATSAPP</button>';p.querySelector('#mq-close').onclick=()=>p.classList.remove('open');p.querySelectorAll('[data-mq]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;cart[i].qty+=+b.dataset.mq;if(cart[i].qty<=0)cart.splice(i,1);save()});p.querySelector('#mq-send').onclick=()=>customer();}function customer(){if(!cart.length){alert('Add at least one product to your quotation.');return}let b=document.getElementById('customer-backdrop');if(!b){b=document.createElement('div');b.id='customer-backdrop';b.className='customer-backdrop';b.innerHTML='<div class="customer-box"><h3>Customer details</h3><p style="color:#66717c">Enter your details before opening WhatsApp.</p><input id="c-name" placeholder="Name" autocomplete="name"><input id="c-phone" placeholder="Phone number" autocomplete="tel"><input id="c-location" placeholder="Location" autocomplete="address-level2"><div class="customer-actions"><button class="mq-cancel" id="c-cancel">CANCEL</button><button class="mq-send" id="c-go">CONTINUE TO WHATSAPP</button></div></div>';document.body.appendChild(b);b.querySelector('#c-cancel').onclick=()=>b.classList.remove('open');b.querySelector('#c-go').onclick=()=>{let n=document.getElementById('c-name').value.trim(),ph=document.getElementById('c-phone').value.trim(),l=document.getElementById('c-location').value.trim();if(!n||!ph||!l){alert('Please enter your name, phone number and location.');return}let lines=cart.map(x=>'- '+x.name+' x'+x.qty+' = KSh '+(x.price*x.qty).toLocaleString()).join('\n');let total=cart.reduce((s,x)=>s+x.price*x.qty,0);window.open('https://wa.me/'+WA+'?text='+encodeURIComponent('Hello Simba Cement Kenya, I would like a quotation.\n\nName: '+n+'\nPhone: '+ph+'\nLocation: '+l+'\n\nItems:\n'+lines+'\n\nTotal: KSh '+total.toLocaleString()),'_blank');b.classList.remove('open')};}b.classList.add('open')}document.addEventListener('click',e=>{let a=e.target.closest('.btn');if(a&&/add to cart|add to quotation/i.test(a.textContent)){e.preventDefault();let c=a.closest('.card');if(c)add(c)}if(e.target.closest('.cart-btn'))openPanel();if(e.target.id==='shop-home')location.href='shop.html'});document.addEventListener('DOMContentLoaded',()=>{let p=document.querySelector('#products');if(p&&!p.querySelector('.shop-hint')){let h=document.createElement('div');h.className='shop-hint';h.innerHTML='Click <a href="shop.html" style="color:#245a8d;font-weight:900">SHOP / OUR PRODUCTS</a> to view all products, adjust quantities and build your quotation.';p.querySelector('.container')?.prepend(h)}let form=document.querySelector('.form form')||document.querySelector('.form')?.closest('form')||document.querySelector('form');if(form){form.addEventListener('submit',e=>{e.preventDefault();let xs=[...form.querySelectorAll('input')].filter(x=>x.type!=='email');let n=xs.find(x=>/name/i.test(x.name||x.placeholder||''))?.value||xs[0]?.value||'';let ph=xs.find(x=>/phone|tel/i.test(x.name||x.placeholder||''))?.value||xs[1]?.value||'';let l=xs.find(x=>/location|town|address/i.test(x.name||x.placeholder||''))?.value||xs[2]?.value||'';let msg=form.querySelector('textarea')?.value||'';if(!n||!ph||!l){alert('Please enter your name, phone number and location.');return}window.open('https://wa.me/'+WA+'?text='+encodeURIComponent('Hello Simba Cement Kenya,\n\nName: '+n+'\nPhone: '+ph+'\nLocation: '+l+'\nMessage: '+(msg||'General enquiry')),'_blank')})}})})();</script>'''
          # Avoid malformed nested style tag in the source above.
          inject=inject.replace('<style id="final-modern"><style id="final-modern">','<style id="final-modern">')
          h=h.replace('</head>',inject+'</head>',1) if '</head>' in h else h+inject
          p.write_text(h.rstrip()+'\n',encoding='utf-8')

          # Dedicated shop page: uses the same live catalogue, with modern +/− quotation controls.
          shop='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop / Our Products | Simba Cement Kenya</title><meta name="description" content="Shop Simba Cement Kenya cement and building materials. Adjust quantities and send a quotation to WhatsApp."><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7f9;color:#121a22}.bar{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #ddd}.bar img{width:180px;height:56px;object-fit:contain}.wrap{max-width:1180px;margin:auto;padding:45px 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #e1e6eb;padding:18px}.pic{height:230px;background:#e9eef3;display:grid;place-items:center}.pic img{max-width:100%;max-height:100%;object-fit:contain}.pill{color:#245a8d;font-size:11px;font-weight:900;letter-spacing:2px}.card h3{margin:8px 0}.card p{color:#66717c}.price{font-weight:900;font-size:19px;margin:12px 0}.btn{border:0;background:#245a8d;color:#fff;padding:11px 15px;font-weight:900;cursor:pointer}.quote{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border:0;border-radius:50%;background:#121a22;color:#fff;font-size:20px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:flex-end}.modal.open{display:flex}.panel{background:#fff;width:min(450px,100%);height:100%;padding:22px;box-sizing:border-box;display:flex;flex-direction:column}.items{flex:1;overflow:auto}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.mini{display:flex;align-items:center;gap:5px}.mini button{width:30px;height:30px;border:1px solid #ccd4dc;background:#fff}.fields input{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border:1px solid #ccd4dc}.total{font-weight:900;font-size:21px;margin:12px 0}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid{grid-template-columns:1fr}.bar img{width:155px}}</style></head><body><div class="bar"><a href="index.html"><img src="https://i.postimg.cc/RhRx14Vm/Screenshot-2026-09-02-151638.png" alt="Simba Cement Kenya"></a><a href="index.html" class="btn">HOME</a></div><main class="wrap"><div class="pill">SHOP / OUR PRODUCTS</div><h1>Choose your building materials.</h1><p>Adjust quantities and send your quotation directly to WhatsApp.</p><div class="grid" id="grid">Loading…</div></main><button class="quote" id="open">🛒</button><div class="modal" id="modal"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Your quotation</h2><button id="close" style="border:0;background:none;font-size:24px">×</button></div><div class="items" id="items"></div><div class="total" id="total">KSh 0</div><div class="fields"><input id="n" placeholder="Name"><input id="ph" placeholder="Phone number"><input id="l" placeholder="Location"></div><button class="btn" id="send">SEND QUOTATION TO WHATSAPP</button></div></div><script>(async()=>{const WA='254780079982';let data=[],cart=JSON.parse(localStorage.getItem('simbaQuoteCartV3')||'[]');try{let t=await (await fetch('index.html')).text();let d=new DOMParser().parseFromString(t,'text/html');data=[...d.querySelectorAll('#products .card')].map((c,i)=>({id:i,name:c.querySelector('h3')?.textContent.trim()||'Product '+(i+1),price:Number((c.querySelector('.price')?.textContent||'0').replace(/[^0-9]/g,'')),img:c.querySelector('img')?.src||'',desc:c.querySelector('p')?.textContent.trim()||''}))}catch(e){}const save=()=>{localStorage.setItem('simbaQuoteCartV3',JSON.stringify(cart));render()};const render=()=>{document.getElementById('grid').innerHTML=data.map(p=>'<article class="card"><div class="pic">'+(p.img?'<img src="'+p.img+'" alt="">':'')+'</div><div class="pill">PRODUCT</div><h3>'+p.name+'</h3><p>'+p.desc+'</p><div class="price">KSh '+p.price.toLocaleString()+'</div><button class="btn" data-add="'+p.id+'">ADD TO QUOTATION +</button></article>').join('');document.getElementById('items').innerHTML=cart.map((x,i)=>'<div class="row"><div><strong>'+x.name+'</strong><div style="font-size:12px;color:#66717c">KSh '+x.price.toLocaleString()+'</div></div><div class="mini"><button data-i="'+i+'" data-d="-1">−</button><span>'+x.qty+'</span><button data-i="'+i+'" data-d="1">+</button></div><button data-r="'+i+'" style="border:0;background:none">×</button></div>').join('');document.getElementById('total').textContent='KSh '+cart.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString()};const open=()=>document.getElementById('modal').classList.add('open');document.addEventListener('click',e=>{if(e.target.dataset.add!==undefined){let p=data[+e.target.dataset.add],x=cart.find(a=>a.name===p.name);if(x)x.qty++;else cart.push({...p,qty:1});save();open()}if(e.target.dataset.i!==undefined){let i=+e.target.dataset.i;cart[i].qty+=+e.target.dataset.d;if(cart[i].qty<=0)cart.splice(i,1);save()}if(e.target.dataset.r!==undefined){cart.splice(+e.target.dataset.r,1);save()}if(e.target.id==='open')open();if(e.target.id==='close')document.getElementById('modal').classList.remove('open');if(e.target.id==='send'){if(!cart.length){alert('Add at least one product.');return}let n=document.getElementById('n').value.trim(),ph=document.getElementById('ph').value.trim(),l=document.getElementById('l').value.trim();if(!n||!ph||!l){alert('Please enter your name, phone number and location.');return}let lines=cart.map(x=>'- '+x.name+' x'+x.qty+' = KSh '+(x.price*x.qty).toLocaleString()).join('\n');let total=cart.reduce((s,x)=>s+x.price*x.qty,0);window.open('https://wa.me/'+WA+'?text='+encodeURIComponent('Hello Simba Cement Kenya, I would like a quotation.\n\nName: '+n+'\nPhone: '+ph+'\nLocation: '+l+'\n\nItems:\n'+lines+'\n\nTotal: KSh '+total.toLocaleString()),'_blank')}});render()})()</script></body></html>'''
          (root/'shop.html').write_text(shop,encoding='utf-8')
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
