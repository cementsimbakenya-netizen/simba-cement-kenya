name: Remove Projects section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove Projects section and navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          html = html.replace('<a href="#projects">PROJECTS</a>', '')
          start = html.find('<section class="projects" id="projects">')
          if start != -1:
              end = html.find('</section>', start)
              if end == -1:
                  raise SystemExit('Projects section closing tag not found')
              html = html[:start] + html[end + len('</section>'):]

          if 'id="projects"' in html or 'href="#projects">PROJECTS' in html:
              raise SystemExit('Projects section was not fully removed')

          p.write_text(html, encoding='utf-8')

      - name: Commit removal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Projects section already removed.'
            exit 0
          fi
          git commit -m 'Remove Projects section completely'
          git push origin main
