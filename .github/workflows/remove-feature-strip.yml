name: Remove feature strip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-feature-strip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove five-feature strip from homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section class="feature">')
          if start == -1:
              print('Feature section already absent.')
          else:
              end = s.find('</section>', start)
              if end == -1:
                  raise SystemExit('Feature section closing tag not found')
              s = s[:start] + s[end + len('</section>'):]
              p.write_text(s, encoding='utf-8')
              print('Removed feature strip.')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove feature strip from homepage'
          git push
