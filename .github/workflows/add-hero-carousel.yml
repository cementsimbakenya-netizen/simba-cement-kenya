name: Apply final Simba Cement logo and hero carousel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-design:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply supplied logo and three hero images
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          hero = '''<section class="hero hero-carousel" id="home" aria-label="Simba Cement featured carousel">
            <div class="hero-slide active" data-hero-slide style="background-image:url('https://i.postimg.cc/1zvgDdzS/Screenshot-2026-09-01-205904.png')"></div>
            <div class="hero-slide" data-hero-slide style="background-image:url('https://i.postimg.cc/9f623F43/Screenshot-2026-09-01-205703.png')"></div>
            <div class="hero-slide" data-hero-slide style="background-image:url('https://i.postimg.cc/5NCtjTVP/Screenshot-2026-09-01-205620.png')"></div>
            <div class="hero-overlay"></div>
            <div class="container hero-content">
              <div class="hero-inner">
                <div class="eyebrow">SIMBA CEMENT · KENYA</div>
                <h1>BUILT TO LAST.<br>BUILT FOR <em>GENERATIONS.</em></h1>
                <p>Premium quality cement for strong and durable structures that stand the test of time.</p>
                <div class="actions">
                  <a class="btn" href="#products">OUR PRODUCTS →</a>
                  <a class="btn outline" href="#contact">FIND A DISTRIBUTOR →</a>
                </div>
              </div>
            </div>
            <button class="hero-arrow hero-prev" id="heroPrev" type="button" aria-label="Previous slide">‹</button>
            <button class="hero-arrow hero-next" id="heroNext" type="button" aria-label="Next slide">›</button>
            <div class="hero-dots" id="heroDots" aria-label="Choose hero slide">
              <button class="hero-dot active" type="button" aria-label="Slide 1"></button>
              <button class="hero-dot" type="button" aria-label="Slide 2"></button>
              <button class="hero-dot" type="button" aria-label="Slide 3"></button>
            </div>
          </section>'''

          s, n = re.subn(r"<section\b[^>]*\bid=['\"]home['\"][^>]*>.*?</section>", hero, s, count=1, flags=re.S|re.I)
          if n != 1:
              raise SystemExit('Could not find the existing #home hero section')

          logo = '<a class="logo" href="#home" aria-label="Simba Cement home"><img src="https://i.postimg.cc/CKSsrtbF/Screenshot-2026-09-01-142431.png" alt="Simba Cement" class="logo-img"></a>'
          s, n = re.subn(r"<a\s+class=['\"]logo['\"][^>]*>.*?</a>", logo, s, count=1, flags=re.S|re.I)
          if n != 1:
              raise SystemExit('Could not find the header logo element')

          css = '''
          .hero-carousel{min-height:640px;position:relative;display:flex;align-items:center;overflow:hidden;background:#eef2f5}
          .hero-carousel .hero-slide{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transform:scale(1.02);transition:opacity .7s ease,transform 5s ease;z-index:0}
          .hero-carousel .hero-slide.active{opacity:1;transform:scale(1)}
          .hero-carousel .hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.9) 40%,rgba(255,255,255,.15) 74%,rgba(18,26,34,.08) 100%)}
          .hero-carousel .hero-content{position:relative;z-index:2;width:100%}
          .hero-carousel .hero-inner{width:100%;padding:80px 0}
          .hero-carousel .hero-arrow{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:48px;height:48px;border:1px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(18,26,34,.42);color:#fff;font-size:34px;line-height:1;display:grid;place-items:center}
          .hero-carousel .hero-prev{left:24px}.hero-carousel .hero-next{right:24px}
          .hero-carousel .hero-dots{position:absolute;z-index:4;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px}
          .hero-carousel .hero-dot{width:11px;height:11px;padding:0;border-radius:50%;border:1px solid #fff;background:rgba(255,255,255,.52)}
          .hero-carousel .hero-dot.active{background:#245a8d;border-color:#245a8d}
          .hero-carousel .btn.outline{background:rgba(255,255,255,.9)}
          .logo{min-width:230px!important;width:230px!important;height:82px!important;padding:0!important;margin:0!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;background:#fff!important;border:0!important;outline:0!important;box-shadow:none!important;overflow:hidden!important}
          .logo-img{width:230px!important;height:82px!important;display:block!important;flex:0 0 230px!important;object-fit:cover!important;object-position:center!important;background:#fff!important;border:0!important;outline:0!important;box-shadow:none!important;transform:scale(1.17)!important;transform-origin:center!important}
          @media(max-width:900px){.logo{min-width:190px!important;width:190px!important;height:70px!important}.logo-img{width:190px!important;height:70px!important;flex-basis:190px!important;transform:scale(1.12)!important}.hero-carousel{min-height:650px}.hero-carousel .hero-overlay{background:linear-gradient(180deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.9) 55%,rgba(255,255,255,.3) 100%)}}
          '''
          s = s.replace('</style>', css + '\n  </style>', 1)

          if "document.querySelectorAll('[data-hero-slide]')" not in s:
              js = '''
          <script>
          (()=>{
            const slides=[...document.querySelectorAll('[data-hero-slide]')];
            const dots=[...document.querySelectorAll('#heroDots .hero-dot')];
            const next=document.getElementById('heroNext');
            const prev=document.getElementById('heroPrev');
            if(!slides.length||!next||!prev)return;
            let i=0,t;
            const show=n=>{i=(n+slides.length)%slides.length;slides.forEach((s,k)=>s.classList.toggle('active',k===i));dots.forEach((d,k)=>d.classList.toggle('active',k===i));};
            const restart=()=>{clearInterval(t);t=setInterval(()=>show(i+1),5000)};
            next.onclick=()=>{show(i+1);restart()};prev.onclick=()=>{show(i-1);restart()};dots.forEach((d,k)=>d.onclick=()=>{show(k);restart()});restart();
          })();
          </script>
          '''
              s = s.replace('</body>', js + '</body>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit final website changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No site changes required.'
          else
            git commit -m 'Apply supplied logo and hero carousel'
            git push
          fi
