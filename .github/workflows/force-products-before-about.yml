name: Force Products Before About

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Products before About Us
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def find_section(text, section_id):
              marker = f'id="{section_id}"'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f'Missing section: {section_id}')
              start = text.rfind('<section', 0, pos)
              end = text.find('</section>', pos)
              if start < 0 or end < 0:
                  raise SystemExit(f'Invalid section: {section_id}')
              return start, end + len('</section>')

          ps, pe = find_section(s, 'products')
          a_start, a_end = find_section(s, 'about')

          if ps > a_start:
              products = s[ps:pe]
              s = s[:ps] + s[pe:]
              a_start, a_end = find_section(s, 'about')
              s = s[:a_start] + products + '\n' + s[a_start:]

          p.write_text(s, encoding='utf-8')
          print('Products position:', s.find('id="products"'))
          print('About position:', s.find('id="about"'))

      - name: Commit reordered homepage
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Homepage already has Products before About Us.'
            exit 0
          fi
          git commit -m 'Move Products before About Us'
          git push
