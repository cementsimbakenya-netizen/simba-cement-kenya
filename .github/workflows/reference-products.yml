name: Apply reference Products section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-products-section:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Products section
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          products_html = '''<section class="products reference-products" id="products">
            <div class="container">
              <div class="reference-products-head">
                <div>
                  <h2>PRODUCTS</h2>
                  <div class="reference-redline"></div>
                </div>
                <p>Our core range of building and construction materials. Browse here while you scroll, or open the full shop to build your order.</p>
              </div>

              <div class="reference-howto"><strong>HOW TO ORDER:</strong> Add products to your cart, adjust quantities or remove items, then continue to checkout. Enter your name, location and phone number before sending the complete order to WhatsApp.</div>

              <div class="reference-product-grid">
                <article class="reference-product-card">
                  <div class="reference-product-image"><img src="https://i.postimg.cc/HLjF3JtR/Screenshot-2026-09-01-205350.png" alt="Simba Cement 32.5R"></div>
                  <div class="reference-product-body">
                    <div class="reference-category">CEMENT</div>
                    <h3>Simba Cement 32.5R</h3>
                    <p>Reliable cement for everyday construction and general building applications.</p>
                    <div class="reference-product-footer"><strong>KSh 550</strong><button class="reference-add reference-add-wide" onclick="addToCart('c325','SIMBA CEMENT 32.5R',550)">ADD TO CART <span>+</span></button></div>
                  </div>
                </article>

                <article class="reference-product-card">
                  <div class="reference-product-image"><img src="https://i.postimg.cc/Gmg5BL14/Screenshot-2026-09-01-205450.png" alt="Simba Power 42.5N"></div>
                  <div class="reference-product-body">
                    <div class="reference-category">CEMENT</div>
                    <h3>Simba Power 42.5N</h3>
                    <p>High-performance cement for projects where added strength and dependable results matter.</p>
                    <div class="reference-product-footer"><strong>KSh 680</strong><button class="reference-add reference-add-wide" onclick="addToCart('p425','SIMBA POWER 42.5N',680)">ADD TO CART <span>+</span></button></div>
                  </div>
                </article>

                <article class="reference-product-card reference-steel-card">
                  <div class="reference-product-image"><img src="https://i.postimg.cc/1XT8nVJy/Screenshot-2026-09-01-224305.png" alt="Reinforcement Steel"></div>
                  <div class="reference-product-body">
                    <div class="reference-category">STEEL</div>
                    <h3>Reinforcement Steel</h3>
                    <p>Select the exact bar size you need and add multiple sizes to the same order.</p>
                    <div class="reference-steel-list">
                      <div><strong>D8</strong><span>KSh 450</span><button onclick="addToCart('d8','REINFORCEMENT STEEL D8',450)">ADD</button></div>
                      <div><strong>D10</strong><span>KSh 750</span><button onclick="addToCart('d10','REINFORCEMENT STEEL D10',750)">ADD</button></div>
                      <div><strong>D12</strong><span>KSh 1,020</span><button onclick="addToCart('d12','REINFORCEMENT STEEL D12',1020)">ADD</button></div>
                      <div><strong>D16</strong><span>KSh 2,050</span><button onclick="addToCart('d16','REINFORCEMENT STEEL D16',2050)">ADD</button></div>
                      <div><strong>D20</strong><span>KSh 3,500</span><button onclick="addToCart('d20','REINFORCEMENT STEEL D20',3500)">ADD</button></div>
                      <div><strong>D25</strong><span>KSh 5,750</span><button onclick="addToCart('d25','REINFORCEMENT STEEL D25',5750)">ADD</button></div>
                    </div>
                  </div>
                </article>

                <article class="reference-product-card">
                  <div class="reference-product-image"><img src="https://i.postimg.cc/wTCkn1g8/Screenshot-2026-09-01-225251.png" alt="Binding Wire"></div>
                  <div class="reference-product-body">
                    <div class="reference-category">BUILDING ACCESSORY</div>
                    <h3>Binding Wire</h3>
                    <p>Practical tying wire for reinforcement and general construction use.</p>
                    <div class="reference-product-footer"><strong>KSh 3,000</strong><button class="reference-add reference-add-wide" onclick="addToCart('wire','BINDING WIRE',3000)">ADD TO CART <span>+</span></button></div>
                  </div>
                </article>

                <article class="reference-product-card">
                  <div class="reference-product-image"><img src="https://i.postimg.cc/90tWV4KG/Screenshot-2026-09-01-224641.png" alt="Hoop Iron"></div>
                  <div class="reference-product-body">
                    <div class="reference-category">BUILDING ACCESSORY</div>
                    <h3>Hoop Iron</h3>
                    <p>Strong and practical hoop iron for masonry, tying and bracing applications.</p>
                    <div class="reference-product-footer"><strong>KSh 2,100</strong><button class="reference-add reference-add-wide" onclick="addToCart('hoop','HOOP IRON',2100)">ADD TO CART <span>+</span></button></div>
                  </div>
                </article>
              </div>
            </div>
          </section>'''

          pattern = re.compile(r'<section[^>]*id=["\']products["\'][^>]*>.*?</section>', re.S | re.I)
          s, n = pattern.subn(products_html, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate the Products section')

          # The old page generated cards dynamically. Make that renderer harmless so it cannot overwrite the reference layout.
          start = s.find('function renderProducts(){')
          if start != -1:
              end = s.find('function changeQty', start)
              if end == -1:
                  raise SystemExit('Could not locate changeQty after renderProducts')
              s = s[:start] + 'function renderProducts(){}\n' + s[end:]

          css = '''<style>
          .reference-products{background:#fff;padding:72px 0 88px}
          .reference-products-head{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:end;margin-bottom:42px}
          .reference-products-head h2{font-size:70px;line-height:.92;letter-spacing:-3px;margin:0;font-weight:900;color:#111}
          .reference-redline{width:60px;height:4px;background:#d31f2b;margin-top:17px}
          .reference-products-head p{margin:0;color:#47617d;font-size:18px;line-height:1.5;max-width:610px}
          .reference-howto{font-size:18px;line-height:1.38;margin:0 0 26px;color:#151515}
          .reference-product-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;align-items:start}
          .reference-product-card{background:#fff;border:1px solid #dfe3e7;min-width:0}
          .reference-product-image{height:250px;background:#fff;border-bottom:1px solid #222;overflow:hidden;display:flex;align-items:center;justify-content:center}
          .reference-product-image img{width:100%;height:100%;display:block;object-fit:contain;object-position:center;background:#fff}
          .reference-product-body{padding:22px 24px 20px}
          .reference-category{font-size:12px;color:#d31f2b;font-weight:900;letter-spacing:1.25px;margin-bottom:8px}
          .reference-product-body h3{font-size:21px;line-height:1.15;margin:0 0 12px;font-weight:800;color:#111}
          .reference-product-body p{font-size:15px;line-height:1.45;color:#56708b;margin:0;min-height:68px}
          .reference-product-footer{border-top:1px solid #e2e2e2;margin-top:24px;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
          .reference-product-footer strong{font-size:15px;color:#526a80;white-space:nowrap}
          .reference-add{border:1px solid #c91f2d;color:#c91f2d;background:#fff;font-weight:900;padding:10px 13px}
          .reference-add:hover{background:#c91f2d;color:#fff}
          .reference-add-wide{background:#c91f2d;color:#fff;border-color:#c91f2d;min-height:52px;padding:0 20px;font-size:16px;line-height:1.1}
          .reference-add-wide span{display:block;margin-top:2px}
          .reference-steel-list{margin-top:22px;display:grid;gap:9px}
          .reference-steel-list>div{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border:1px solid #e3e7eb;border-radius:6px;padding:9px 10px;background:#fafafa}
          .reference-steel-list strong{font-size:15px}.reference-steel-list span{font-size:14px;color:#526a80}.reference-steel-list button{border:1px solid #d92a37;background:#fff;color:#c91f2d;font-weight:900;padding:8px 12px}.reference-steel-list button:hover{background:#c91f2d;color:#fff}
          @media(max-width:1250px){.reference-product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.reference-products-head{gap:40px}}
          @media(max-width:850px){.reference-products-head{grid-template-columns:1fr;gap:18px}.reference-products-head h2{font-size:56px}.reference-product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.reference-product-image{height:235px}}
          @media(max-width:560px){.reference-product-grid{grid-template-columns:1fr}.reference-product-image{height:270px}.reference-product-body{padding:20px}.reference-products-head p,.reference-howto{font-size:16px}}
          </style>'''
          s = s.replace('</head>', css + '\n</head>', 1)

          p.write_text(s, encoding='utf-8')
          print('REFERENCE_PRODUCTS_DONE')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Match Products section to supplied reference'
            git push
          fi
